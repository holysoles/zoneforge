name: PR Jobs
on:
  pull_request:
jobs:
  pytest:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup UV and set Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test with pytest
        run: uv run --frozen --group ci pytest
  black:
    name: Python Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Run black
        uses: psf/black@782e5605c86aab56be6f905da10dcd3e463fd9c2 # 25.12.0
        with:
          options: ". --check --verbose"
  pylint:
    name: Python Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup UV and set Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run pylint
        run: |
          uv run --frozen --group ci pylint $(git ls-files '*.py' | grep -v dnspython)
  eslint:
    name: JS Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Setup Bun and Run ESLint
        run: |
          bun init -y
          bun add eslint @eslint/js globals
          bunx eslint
  stylelint:
    name: CSS Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Run stylelint
        run: |
          bun init -y
          bun install stylelint stylelint-config-standard
          bunx stylelint static/css/*.css
  actionlint:
    name: 'Github Actions YAML Lint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Download actionlint
        run: |
          VERSION="1.7.7"
          ARCH=$(dpkg --print-architecture)
          wget -c "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_${ARCH}.tar.gz" -O - | tar -xz
      - name: Check workflow files
        run: ./actionlint -shellcheck= -pyflakes= -color
